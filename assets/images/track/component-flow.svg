<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">Track Spline Builder component flow</title>
  <desc id="desc">Wheel bones feed the Track Physics Solver, the solver writes a spline, and Track Spline Builder places links and connectors on that spline.</desc>
  <defs>
    <style>
      .box{fill:#151b22;stroke:#4aa8d8;stroke-width:3}.soft{fill:#1d2630;stroke:#63788a;stroke-width:2}
      .title{fill:#f3f7fa;font:700 24px system-ui,sans-serif}.label{fill:#b9c8d3;font:17px system-ui,sans-serif}
      .arrow{fill:none;stroke:#62c4ee;stroke-width:4;marker-end:url(#head)}.note{fill:#7f96a8;font:15px system-ui,sans-serif}
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#62c4ee"/></marker>
  </defs>
  <rect width="1120" height="330" rx="24" fill="#0f1318"/>
  <rect class="soft" x="42" y="92" width="205" height="132" rx="16"/>
  <text class="title" x="145" y="138" text-anchor="middle">Wheel rig</text>
  <text class="label" x="145" y="174" text-anchor="middle">road wheels</text>
  <text class="label" x="145" y="200" text-anchor="middle">end wheels · rollers</text>
  <rect class="box" x="322" y="72" width="250" height="172" rx="16"/>
  <text class="title" x="447" y="124" text-anchor="middle">Track Physics Solver</text>
  <text class="label" x="447" y="164" text-anchor="middle">builds and deforms</text>
  <text class="label" x="447" y="190" text-anchor="middle">the track loop</text>
  <rect class="soft" x="645" y="92" width="170" height="132" rx="16"/>
  <text class="title" x="730" y="148" text-anchor="middle">Spline</text>
  <text class="label" x="730" y="183" text-anchor="middle">solved shape</text>
  <rect class="box" x="888" y="72" width="190" height="172" rx="16"/>
  <text class="title" x="983" y="124" text-anchor="middle">Builder</text>
  <text class="label" x="983" y="164" text-anchor="middle">links</text>
  <text class="label" x="983" y="190" text-anchor="middle">connectors</text>
  <path class="arrow" d="M247 158 H312"/><path class="arrow" d="M572 158 H635"/><path class="arrow" d="M815 158 H878"/>
  <text class="note" x="560" y="292" text-anchor="middle">One side = one Solver + one Spline + one Builder</text>
</svg>
