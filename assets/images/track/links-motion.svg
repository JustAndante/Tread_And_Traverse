<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">Track link spacing and motion</title><desc id="desc">A fixed number of paired links and connectors moves by wheel angle multiplied by the Chaos wheel radius.</desc>
  <defs><style>.path{fill:none;stroke:#566a78;stroke-width:5}.link{fill:#26313b;stroke:#d7a85a;stroke-width:3}.conn{fill:#70bce3}.t{fill:#eef5f8;font:700 21px system-ui,sans-serif}.s{fill:#aebfca;font:16px system-ui,sans-serif}.arrow{fill:none;stroke:#68d391;stroke-width:5;marker-end:url(#h)}</style><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#68d391"/></marker></defs>
  <rect width="1120" height="330" rx="24" fill="#0f1318"/><path class="path" d="M90 190 Q150 90 260 92 H860 Q970 95 1030 190 Q968 285 860 278 H260 Q150 280 90 190 Z"/>
  <g transform="translate(190 74)"><rect class="link" width="106" height="44" rx="8"/><circle class="conn" cx="116" cy="22" r="8"/><rect class="link" x="132" width="106" height="44" rx="8"/><circle class="conn" cx="248" cy="22" r="8"/><rect class="link" x="264" width="106" height="44" rx="8"/><circle class="conn" cx="380" cy="22" r="8"/><rect class="link" x="396" width="106" height="44" rx="8"/><circle class="conn" cx="512" cy="22" r="8"/><rect class="link" x="528" width="106" height="44" rx="8"/><circle class="conn" cx="644" cy="22" r="8"/><rect class="link" x="660" width="106" height="44" rx="8"/></g>
  <path class="arrow" d="M365 222 H745"/><text class="t" x="555" y="264" text-anchor="middle">distance = wheel angle × Chaos wheel radius</text><text class="s" x="555" y="294" text-anchor="middle">Fixed Link Count keeps the number of links constant while the solved loop deforms</text>
</svg>
